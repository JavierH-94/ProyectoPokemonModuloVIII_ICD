name: Compilar y Publicar Flexdashboard

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true 

      - name: Instalar dependencias de R
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "flexdashboard", "tidyverse", "scales", "DT", "plotly", "jsonlite", "httr"))'

      - name: Renderizar el Dashboard a HTML
        run: |
          mkdir -p _site
          Rscript -e 'rmarkdown::render("dashboard_pokemonOriginal_v6.Rmd", output_file = "index.html", output_dir = "_site")'

      - name: Subir artefacto generado
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
